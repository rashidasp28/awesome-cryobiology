<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="50" font-size="32" text-anchor="middle" font-family="Arial">Ice Recrystallization</text>

<text x="250" y="120" font-size="26" text-anchor="middle" font-family="Arial">Initial State</text>
<circle cx="150" cy="250" r="25" fill="none" stroke="black" stroke-width="3"/>
<circle cx="250" cy="280" r="20" fill="none" stroke="black" stroke-width="3"/>
<circle cx="350" cy="220" r="18" fill="none" stroke="black" stroke-width="3"/>
<circle cx="220" cy="380" r="22" fill="none" stroke="black" stroke-width="3"/>
<circle cx="320" cy="360" r="16" fill="none" stroke="black" stroke-width="3"/>

<line x1="470" y1="300" x2="700" y2="300" stroke="black" stroke-width="4"/>
<polygon points="700,300 670,285 670,315" fill="black"/>

<text x="900" y="120" font-size="26" text-anchor="middle" font-family="Arial">After Recrystallization</text>
<circle cx="850" cy="300" r="70" fill="none" stroke="black" stroke-width="4"/>
<circle cx="1020" cy="280" r="45" fill="none" stroke="black" stroke-width="4"/>

<text x="600" y="520" font-size="22" text-anchor="middle" font-family="Arial">Small ice crystals merge into fewer larger crystals during storage or warming.</text>
</svg>