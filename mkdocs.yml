site_name: Awesome Cryobiology
site_description: Open knowledge hub for cryobiology, cryomicroscopy, cryoengineering, and AI-assisted low-temperature biology.
site_url: https://rashidasp28.github.io/awesome-cryobiology/
repo_url: https://github.com/rashidasp28/awesome-cryobiology
repo_name: awesome-cryobiology

docs_dir: website
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Cryomicroscopy: cryomicroscopy.md
  - AI and Computational Cryobiology: ai.md
  - Cryoengineering: cryoengineering.md
  - Figures and Visual Learning: figures.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
