<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="50" font-size="32" text-anchor="middle" font-family="Arial">Slow Freezing vs Vitrification</text>
<rect x="100" y="120" width="420" height="450" fill="none" stroke="black" stroke-width="3"/>
<text x="310" y="170" font-size="28" text-anchor="middle" font-family="Arial">Slow Freezing</text>
<text x="140" y="240" font-size="22" font-family="Arial">• Lower CPA concentration</text>
<text x="140" y="300" font-size="22" font-family="Arial">• Gradual cooling</text>
<text x="140" y="360" font-size="22" font-family="Arial">• Ice crystal formation</text>
<text x="140" y="420" font-size="22" font-family="Arial">• Osmotic dehydration</text>
<text x="140" y="480" font-size="22" font-family="Arial">• Risk of recrystallization</text>
<rect x="680" y="120" width="420" height="450" fill="none" stroke="black" stroke-width="3"/>
<text x="890" y="170" font-size="28" text-anchor="middle" font-family="Arial">Vitrification</text>
<text x="720" y="240" font-size="22" font-family="Arial">• High CPA concentration</text>
<text x="720" y="300" font-size="22" font-family="Arial">• Ultra-rapid cooling</text>
<text x="720" y="360" font-size="22" font-family="Arial">• Glass-like solidification</text>
<text x="720" y="420" font-size="22" font-family="Arial">• Minimal ice formation</text>
<text x="720" y="480" font-size="22" font-family="Arial">• Risk during warming</text>
</svg>